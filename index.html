<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <link rel="stylesheet" href="/src/css/app.css">
  </head>
  <body class="antialiased select-none">
    <div id="app">
      <div id="simulation">
        <div class="flex items-center justify-center h-screen overflow-hidden w-full bg-gray-900 space-x-3 p-3 text-gray-100">
          <aside class="w-1/3 h-full border-gray-700 border-2 bg-black flex flex-col xl:min-w-[800px] lg:min-w-[600px]">
            <header class="flex items-center justify-between font-mono uppercase border-b-2 px-3 border-gray-700 h-10">
              <h1>POLE's Flight Sim</h1>
            </header>
            <div class="grid grid-cols-6 gap-3 p-3 h-full flex-1 overflow-hidden grid-rows-12">
              <div class="bg-gray-800 border-green-500 border flex items-center justify-center col-span-3 h-full row-span-2">
                //
              </div>
              <button onclick="startSimulation()" type="button" class="cursor-pointer col-span-1 bg-gray-800 border-green-500 border flex items-center justify-center h-full p-3 text-center">
                Start Simulation
              </button>
            </div>
          </aside>
          <div class="w-2/3 h-full bg-black border-gray-700 border-2 p-3">
            main canvas
          </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
